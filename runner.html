<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <!-- Google AdSense Auto Ads Code -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9844319997817181" crossorigin="anonymous"></script>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-F8B9HWR005"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-F8B9HWR005');
    </script>

    <!-- Tailwind CSS & Google Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet"> 

    <!-- Firebase SDK (Compat) for Global Leaderboard -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b0f19">

    <!-- SEO Optimized Title & Description -->
    <title>Cyber Runner | Play Free Online Cyberpunk Runner Game with Global Leaderboard</title>
    <meta name="description" content="Play Cyber Runner online for free! Experience sleek cyberpunk design, smooth touch controls, game history tracking, and global Top 100 leaderboards.">
    <link rel="canonical" href="https://jackywanyt.github.io/runner.html">

    <style>
        body {
            font-family: 'Outfit', sans-serif;
            touch-action: none;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            background-color: #0b0f19;
            color: #ffffff;
            height: 100dvh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 10px;
            gap: 10px;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 正方形畫面的容器 */
        .runner-wrapper {
            position: relative;
            width: 100%;
            max-width: min(380px, 55dvh);
            aspect-ratio: 1;
        }

        canvas {
            background: #080c14;
            display: block;
            margin: 0 auto;
            border-radius: 20px;
            border: 1px solid rgba(255, 0, 127, 0.3);
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.2);
            width: 100%;
            height: 100%;
            aspect-ratio: 1;
        }

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    </style>
</head>
<body>

    <!-- 🌐 Dynamic Navbar Container -->
    <header class="w-full max-w-4xl mx-auto px-4 pt-2">
        <div id="navbar-container"></div>
    </header>

    <!-- Header / Scores -->
    <div class="w-full max-w-[380px] flex items-center justify-between px-1">
        <div>
            <h1 class="text-xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-400 to-cyan-400">
                CYBER RUNNER
            </h1>
            <p class="text-[8px] font-semibold tracking-wider text-slate-400 uppercase">CYBER ARCADE EDITION</p>
        </div>
        <div class="flex gap-2">
            <div class="glass-panel px-2.5 py-1 rounded-xl text-center min-w-[65px]">
                <div class="text-[8px] font-bold text-slate-400 uppercase tracking-wider">Score</div>
                <div id="currentScore" class="text-sm font-extrabold text-pink-400">0</div>
            </div>
            <div class="glass-panel px-2.5 py-1 rounded-xl text-center min-w-[65px]">
                <div class="text-[8px] font-bold text-slate-400 uppercase tracking-wider">High Score</div>
                <div id="highScore" class="text-sm font-extrabold text-amber-400">0</div>
            </div>
        </div>
    </div>

    <!-- Controls Bar -->
    <div class="w-full max-w-[380px] grid grid-cols-3 gap-1.5 px-1">
        <button id="btn-restart" class="glass-panel hover:bg-slate-800 text-slate-200 font-bold py-1.5 px-2 rounded-xl transition text-[11px] flex items-center justify-center gap-1 active:scale-95">Restart</button>
        <button id="btn-history" class="glass-panel hover:bg-slate-800 text-slate-200 font-bold py-1.5 px-2 rounded-xl transition text-[11px] flex items-center justify-center gap-1 active:scale-95">History</button>
        <button id="btn-rank" class="glass-panel hover:bg-slate-800 text-slate-200 font-bold py-1.5 px-2 rounded-xl transition text-[11px] flex items-center justify-center gap-1 active:scale-95 text-cyan-400">Rank</button>
    </div>

    <!-- Runner Game Board Wrapper (Square) -->
    <div class="runner-wrapper w-full">
        <canvas id="gameCanvas" width="500" height="500"></canvas>

        <!-- Game Over Overlay -->
        <div id="overlay" class="absolute inset-0 bg-slate-950/90 backdrop-blur-md rounded-2xl flex flex-col items-center justify-center hidden z-30 p-4 transition-all">
            <h2 class="text-xl font-black mb-1 text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-cyan-400">System Crash!</h2>
            <p class="text-slate-300 text-xs mb-3 font-semibold">Final Score: <span id="current-end-score" class="text-pink-400 font-bold">0</span></p>
            
            <div id="submit-score-box" class="w-full max-w-xs flex flex-col gap-2 mb-3">
                <input type="text" id="player-name" placeholder="Enter your name (Max 10 chars)" maxlength="10" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white text-center focus:outline-none focus:border-cyan-400">
                <button id="btn-submit-score" class="bg-gradient-to-r from-cyan-500 to-blue-600 text-white text-xs font-bold py-1.5 px-4 rounded-xl shadow active:scale-95 transition">Submit to Leaderboard</button>
            </div>

            <button id="btn-try-again" class="bg-gradient-to-r from-pink-500 to-purple-600 text-white text-xs font-bold py-2 px-6 rounded-xl shadow-lg shadow-pink-500/25 active:scale-95 transition">
                Play Again
            </button>
        </div>

        <!-- History Modal -->
        <div id="modal-history" class="absolute inset-0 bg-slate-950/95 backdrop-blur-md rounded-2xl flex flex-col p-4 hidden z-40">
            <div class="flex justify-between items-center mb-2">
                <h3 class="text-sm font-bold text-cyan-400">Game History</h3>
                <button id="close-history" class="text-slate-400 hover:text-white text-xs font-bold px-2">✕</button>
            </div>
            <div id="history-list" class="flex-1 overflow-y-auto custom-scroll flex flex-col gap-1.5 text-xs pr-1"></div>
        </div>

        <!-- Leaderboard Modal -->
        <div id="modal-rank" class="absolute inset-0 bg-slate-950/95 backdrop-blur-md rounded-2xl flex flex-col p-4 hidden z-40">
            <div class="flex justify-between items-center mb-2">
                <h3 class="text-sm font-bold text-pink-400">Global Top 100 Leaderboard</h3>
                <button id="close-rank" class="text-slate-400 hover:text-white text-xs font-bold px-2">✕</button>
            </div>
            <div id="rank-list" class="flex-1 overflow-y-auto custom-scroll flex flex-col gap-1.5 text-xs pr-1">
                <div class="text-center text-slate-500 py-6">Loading...</div>
            </div>
        </div>
    </div>

    <!-- Footer Instruction Area -->
    <div class="w-full max-w-[380px] text-center text-[10px] text-slate-500 font-medium py-1 flex items-center justify-center">
        Tap <span class="bg-slate-800 text-slate-300 px-1.5 py-0.5 mx-1 rounded border border-slate-700">Anywhere</span> or press <span class="bg-slate-800 text-slate-300 px-1.5 py-0.5 mx-1 rounded border border-slate-700">Spacebar</span> to Jump
    </div>

    <script>
        // ==========================================
        // 🛠️ FIREBASE CONFIGURATION
        // ==========================================
        const firebaseConfig = {
          apiKey: "AIzaSyAAAwcNQ5mDUUR_A27PbGNhu64tytQ7tSE",
          authDomain: "mini-game-2048.firebaseapp.com",
          projectId: "mini-game-2048",
          storageBucket: "mini-game-2048.firebasestorage.app",
          messagingSenderId: "119779986825",
          appId: "1:119779986825:web:e1bbc859f068ff882da558",
          measurementId: "G-F8B9HWR005"
        };

        let db = null;
        try {
            if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY") {
                firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
            }
        } catch (e) {
            console.log("Firebase initialization failed");
        }

        // ==========================================
        // 🎮 RUNNER GAME CORE LOGIC (Square 500x500 + Delta Time)
        // ==========================================
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const scoreEl = document.getElementById("currentScore");
        const highScoreEl = document.getElementById("highScore");
        const overlayEl = document.getElementById("overlay");

        let score = 0;
        let highScore = parseInt(localStorage.getItem("cyberRunnerHighScore") || '0');
        highScoreEl.textContent = highScore;

        let gameRunning = false;
        let gameOver = false;
        
        let lastTime = 0;
        let obstacleTimer = 0; // 改為累計真實秒數 (Seconds)

        const groundY = 380;

        let player = {
            x: 70,
            y: groundY - 45,
            width: 35,
            height: 45,
            vy: 0,
            gravity: 0.32,
            jumpPower: -12.5,
            grounded: true
        };

        let obstacles = [];
        let particles = [];
        let gameSpeed = 1.6;

        // Keyboard controls
        window.addEventListener("keydown", (e) => {
            if (e.code === "Space" || e.code === "ArrowUp") {
                e.preventDefault();
                triggerJumpOrStart();
            }
            if (e.code === "KeyR" && gameOver) {
                resetGame();
            }
        });

        // Click / Tap anywhere on the browser window
        document.addEventListener("click", (e) => {
            if (e.target.closest('button, input, #modal-history, #modal-rank, header')) return;
            triggerJumpOrStart();
        });

        function triggerJumpOrStart() {
            if (!gameRunning && !gameOver) {
                startGame();
            } else if (gameRunning && player.grounded) {
                jump();
            } else if (gameOver) {
                resetGame();
            }
        }

        function startGame() {
            gameRunning = true;
            gameOver = false;
            overlayEl.classList.add('hidden');
            lastTime = performance.now();
            obstacleTimer = 0;
            requestAnimationFrame(loop);
        }

        function jump() {
            player.vy = player.jumpPower;
            player.grounded = false;
            for (let i = 0; i < 5; i++) {
                particles.push({
                    x: player.x + player.width / 2,
                    y: player.y + player.height,
                    vx: (Math.random() - 0.5) * 4,
                    vy: Math.random() * -3,
                    alpha: 1
                });
            }
        }

        function resetGame() {
            obstacles = [];
            particles = [];
            score = 0;
            gameSpeed = 1.6;
            player.y = groundY - player.height;
            player.vy = 0;
            player.grounded = true;
            gameOver = false;
            gameRunning = true;
            scoreEl.textContent = score;
            overlayEl.classList.add('hidden');
            document.getElementById('submit-score-box').classList.remove('hidden');
            document.getElementById('btn-submit-score').innerText = "Submit to Leaderboard";
            document.getElementById('btn-submit-score').disabled = false;
            lastTime = performance.now();
            obstacleTimer = 0;
            requestAnimationFrame(loop);
        }

        function saveHistoryRecord(finalScore) {
            let history = JSON.parse(localStorage.getItem('cyberRunner_history') || '[]');
            const record = {
                score: finalScore,
                date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };
            history.unshift(record);
            if (history.length > 20) history = history.slice(0, 20);
            localStorage.setItem('cyberRunner_history', JSON.stringify(history));
        }

        function update(dt, deltaTime) {
            score += dt;
            let currentScoreInt = Math.floor(score / 10);
            scoreEl.textContent = currentScoreInt;

            gameSpeed = 1.6 + Math.floor(currentScoreInt / 60) * 0.15;

            // 玩家物理運算
            player.vy += player.gravity * dt;
            player.y += player.vy * dt;

            if (player.y > groundY - player.height) {
                player.y = groundY - player.height;
                player.vy = 0;
                player.grounded = true;
            }

            // 【已修正】障礙物生成計時器：使用真實秒數 (deltaTime)
            obstacleTimer += deltaTime;
            let spawnInterval = Math.max(1.5, 2.8 - Math.floor(currentScoreInt / 50) * 0.1); // 單位：秒 (每 1.5 ~ 2.8 秒生成一個)
            
            if (obstacleTimer >= spawnInterval) {
                obstacleTimer = 0;
                let height = Math.floor(Math.random() * 45) + 35;
                obstacles.push({
                    x: canvas.width,
                    y: groundY - height,
                    width: 25,
                    height: height,
                    color: Math.random() > 0.5 ? "#ff007f" : "#ffe600"
                });
            }

            // 更新障礙物位置
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= gameSpeed * dt;

                if (
                    player.x < obstacles[i].x + obstacles[i].width &&
                    player.x + player.width > obstacles[i].x &&
                    player.y < obstacles[i].y + obstacles[i].height &&
                    player.y + player.height > obstacles[i].y
                ) {
                    triggerGameOver();
                }

                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                }
            }

            // 更新粒子特效
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].x += particles[i].vx * dt;
                particles[i].y += particles[i].vy * dt;
                particles[i].alpha -= 0.03 * dt;
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function triggerGameOver() {
            gameOver = true;
            gameRunning = false;
            let finalScore = Math.floor(score / 10);
            if (finalScore > highScore) {
                highScore = finalScore;
                localStorage.setItem("cyberRunnerHighScore", highScore);
                highScoreEl.textContent = highScore;
            }
            saveHistoryRecord(finalScore);
            document.getElementById('current-end-score').innerText = finalScore;
            overlayEl.classList.remove('hidden');
        }

        function draw() {
            ctx.fillStyle = "#080c14";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 背景網格線
            ctx.strokeStyle = "rgba(0, 240, 255, 0.05)";
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 40) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, canvas.height);
                ctx.stroke();
            }

            // 地面線條
            ctx.strokeStyle = "#ff007f";
            ctx.shadowBlur = 12;
            ctx.shadowColor = "#ff007f";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, groundY);
            ctx.lineTo(canvas.width, groundY);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // 玩家
            ctx.fillStyle = "#00f0ff";
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#00f0ff";
            ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.shadowBlur = 0;

            // 障礙物
            obstacles.forEach(obs => {
                ctx.fillStyle = obs.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = obs.color;
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
                ctx.shadowBlur = 0;
            });

            // 粒子
            particles.forEach(p => {
                ctx.fillStyle = `rgba(0, 240, 255, ${p.alpha})`;
                ctx.fillRect(p.x, p.y, 4, 4);
            });

            if (!gameRunning && !gameOver) {
                ctx.fillStyle = "rgba(5, 5, 10, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#00f0ff";
                ctx.font = "bold 20px 'Outfit', sans-serif";
                ctx.textAlign = "center";
                ctx.shadowBlur = 15;
                ctx.shadowColor = "#00f0ff";
                ctx.fillText("TAP ANYWHERE TO START", canvas.width / 2, canvas.height / 2);
                ctx.shadowBlur = 0;
                ctx.textAlign = "left";
            }
        }

        // 結合 Delta Time 的遊戲主迴圈
        function loop(timestamp) {
            if (!gameRunning) return;

            const deltaTime = (timestamp - lastTime) / 1000; // 實際經過秒數
            lastTime = timestamp;

            const cappedDelta = Math.min(deltaTime, 0.1);
            const dt = cappedDelta * 60; // 60 FPS 基準倍率

            update(dt, cappedDelta); // 傳入 dt 與真實秒數 cappedDelta
            draw();

            if (gameRunning) {
                requestAnimationFrame(loop);
            }
        }

        draw();

        // ==========================================
        // 📊 UI Modals & Data Handling
        // ==========================================
        const modalHistory = document.getElementById('modal-history');
        const modalRank = document.getElementById('modal-rank');
        const historyListEl = document.getElementById('history-list');
        const rankListEl = document.getElementById('rank-list');

        document.getElementById('btn-history').addEventListener('click', () => {
            const history = JSON.parse(localStorage.getItem('cyberRunner_history') || '[]');
            if (history.length === 0) {
                historyListEl.innerHTML = `<div class="text-center text-slate-500 py-6">No game history yet, play a game now!</div>`;
            } else {
                historyListEl.innerHTML = history.map(item => `
                    <div class="bg-slate-900/80 border border-slate-800 p-2.5 rounded-xl flex justify-between items-center">
                        <div>
                            <div class="text-slate-400 text-[10px]">${item.date}</div>
                        </div>
                        <div class="text-right">
                            <div class="text-[10px] text-slate-400">Score</div>
                            <div class="text-pink-400 font-extrabold text-sm">${item.score}</div>
                        </div>
                    </div>
                `).join('');
            }
            modalHistory.classList.remove('hidden');
        });

        document.getElementById('close-history').addEventListener('click', () => modalHistory.classList.add('hidden'));

        document.getElementById('btn-rank').addEventListener('click', async () => {
            modalRank.classList.remove('hidden');
            if (!db) {
                rankListEl.innerHTML = `<div class="text-center text-amber-400 py-4 px-2 text-xs">Please ensure valid Firebase configuration.</div>`;
                return;
            }
            try {
                rankListEl.innerHTML = `<div class="text-center text-slate-500 py-6">Loading...</div>`;
                const snapshot = await db.collection('runner_leaderboard').orderBy('score', 'desc').limit(100).get();
                if (snapshot.empty) {
                    rankListEl.innerHTML = `<div class="text-center text-slate-500 py-6">No global records found!</div>`;
                    return;
                }
                let html = '';
                let rank = 1;
                snapshot.forEach(doc => {
                    const data = doc.data();
                    let badgeColor = "text-slate-300";
                    if (rank === 1) badgeColor = "text-amber-400 font-black text-sm";
                    else if (rank === 2) badgeColor = "text-slate-200 font-bold";
                    else if (rank === 3) badgeColor = "text-amber-600 font-bold";

                    let displayDate = data.date || '';
                    if (data.date && typeof data.date === 'object' && data.date.seconds) {
                        displayDate = new Date(data.date.seconds * 1000).toLocaleDateString();
                    }

                    html += `
                        <div class="bg-slate-900/80 border border-slate-800 p-2.5 rounded-xl flex justify-between items-center">
                            <div class="flex items-center gap-3">
                                <span class="${badgeColor} w-6 text-center">#${rank}</span>
                                <div>
                                    <div class="text-white font-bold text-xs">${escapeHtml(data.name || 'Anonymous')}</div>
                                    <div class="text-[9px] text-slate-500">${displayDate}</div>
                                </div>
                            </div>
                            <div class="text-pink-400 font-extrabold text-sm">${data.score}</div>
                        </div>
                    `;
                    rank++;
                });
                rankListEl.innerHTML = html;
            } catch (err) {
                rankListEl.innerHTML = `<div class="text-center text-red-400 py-6">Failed to load leaderboard.</div>`;
            }
        });

        document.getElementById('close-rank').addEventListener('click', () => modalRank.classList.add('hidden'));

        document.getElementById('btn-submit-score').addEventListener('click', async () => {
            const nameInput = document.getElementById('player-name').value.trim() || 'Anonymous';
            if (!db) {
                alert("Firebase is not configured!");
                return;
            }
            const btn = document.getElementById('btn-submit-score');
            btn.innerText = "Submitting...";
            btn.disabled = true;

            try {
                await db.collection('runner_leaderboard').add({
                    name: nameInput,
                    score: Math.floor(score / 10),
                    date: new Date().toLocaleDateString()
                });
                alert("Score successfully submitted!");
                document.getElementById('submit-score-box').classList.add('hidden');
            } catch (e) {
                alert("Submission failed, please try again.");
                btn.innerText = "Submit to Leaderboard";
                btn.disabled = false;
            }
        });

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        document.getElementById('btn-restart').addEventListener('click', resetGame);
        document.getElementById('btn-try-again').addEventListener('click', resetGame);

        // ==========================================
        // 🌐 Dynamic Navbar Loader Handler
        // ==========================================
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById('navbar-container');
            if (!container) return;

            fetch('navbar.html')
                .then(response => {
                    if (!response.ok) throw new Error('Failed to load navbar');
                    return response.text();
                })
                .then(html => {
                    container.innerHTML = html;

                    const navToggle = document.getElementById('navToggle');
                    const navMenu = document.getElementById('navMenu');
                    if (navToggle && navMenu) {
                        navToggle.addEventListener('click', () => {
                            navMenu.classList.toggle('hidden');
                            navMenu.classList.toggle('flex');
                        });
                    }

                    const currentPage = window.location.pathname.split('/').pop() || 'index.html';
                    const navLinks = document.querySelectorAll('.nav-link');
                    navLinks.forEach(link => {
                        const linkPage = link.getAttribute('href');
                        if (linkPage === currentPage) {
                            link.classList.add('active');
                        }
                    });
                })
                .catch(error => console.log('Navbar component not loaded yet.'));
        });
    </script>
</body>
</html>
