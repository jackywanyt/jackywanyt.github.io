<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mini Game 2048</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            touch-action: none;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            background-color: #0b0f19;
            color: #ffffff;
            height: 100dvh;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 12px;
            gap: 12px;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* 根據手機高度動態縮放棋盤，確保不會被切掉 */
        .board-wrapper {
            position: relative;
            width: 100%;
            max-width: min(400px, 66dvh);
            aspect-ratio: 1;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 8px;
            background: rgba(30, 41, 59, 0.7);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);
            position: relative;
            width: 100%;
            height: 100%;
        }

        .tile-slot {
            aspect-ratio: 1;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .tile {
            position: absolute;
            aspect-ratio: 1;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.75rem;
            transition: transform 0.15s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 10;
        }

        .tile-new {
            animation: appear 0.18s ease-out forwards;
        }

        .tile-merged {
            animation: pop 0.18s ease-in-out forwards;
            z-index: 20;
        }

        @keyframes appear {
            0% { opacity: 0; transform: var(--tile-pos) scale(0); }
            100% { opacity: 1; transform: var(--tile-pos) scale(1); }
        }

        @keyframes pop {
            0% { transform: var(--tile-pos) scale(1); }
            50% { transform: var(--tile-pos) scale(1.15); }
            100% { transform: var(--tile-pos) scale(1); }
        }

        /* Tile Neon Color Schemes */
        .tile-2    { background: linear-gradient(135deg, #1e293b, #334155); color: #f8fafc; border: 1px solid #475569; }
        .tile-4    { background: linear-gradient(135deg, #0f4c81, #1e3a8a); color: #38bdf8; border: 1px solid #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }
        .tile-8    { background: linear-gradient(135deg, #1e1b4b, #312e81); color: #818cf8; border: 1px solid #6366f1; box-shadow: 0 0 12px rgba(99, 102, 241, 0.4); }
        .tile-16   { background: linear-gradient(135deg, #4c1d95, #581c87); color: #c084fc; border: 1px solid #c084fc; box-shadow: 0 0 14px rgba(192, 132, 252, 0.4); }
        .tile-32   { background: linear-gradient(135deg, #831843, #701a75); color: #f472b6; border: 1px solid #f472b6; box-shadow: 0 0 16px rgba(244, 114, 182, 0.5); }
        .tile-64   { background: linear-gradient(135deg, #9f1239, #881337); color: #fb7185; border: 1px solid #fb7185; box-shadow: 0 0 18px rgba(251, 113, 133, 0.5); }
        .tile-128  { background: linear-gradient(135deg, #c2410c, #9a3412); color: #fb923c; border: 1px solid #fb923c; font-size: 1.5rem; box-shadow: 0 0 20px rgba(251, 146, 60, 0.6); }
        .tile-256  { background: linear-gradient(135deg, #b45309, #78350f); color: #fbbf24; border: 1px solid #fbbf24; font-size: 1.5rem; box-shadow: 0 0 22px rgba(251, 191, 36, 0.6); }
        .tile-512  { background: linear-gradient(135deg, #a16207, #713f12); color: #facc15; border: 1px solid #facc15; font-size: 1.5rem; box-shadow: 0 0 24px rgba(250, 204, 21, 0.7); }
        .tile-1024 { background: linear-gradient(135deg, #15803d, #14532d); color: #4ade80; border: 1px solid #4ade80; font-size: 1.3rem; box-shadow: 0 0 26px rgba(74, 222, 128, 0.7); }
        .tile-2048 { background: linear-gradient(135deg, #0e7490, #155e75); color: #22d3ee; border: 1px solid #22d3ee; font-size: 1.3rem; box-shadow: 0 0 30px rgba(34, 211, 238, 0.9); }
    </style>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9844319997817181"
     crossorigin="anonymous"></script>
    <meta name="google-site-verification" content="B4GYgN_yeOJ3RjiM3XjNQEIAMEZtGFLNjNpTP6wb03Q" />
</head>
<body>

    <!-- Header / Scores -->
    <div class="w-full max-w-md flex items-center justify-between">
        <div>
            <h1 class="text-3xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-pink-500 via-purple-400 to-cyan-400">
                2048
            </h1>
            <p class="text-[10px] font-semibold tracking-wider text-slate-400 uppercase">CYBER EDITION</p>
        </div>
        <div class="flex gap-2">
            <div class="glass-panel px-3 py-1.5 rounded-xl text-center min-w-[70px]">
                <div class="text-[9px] font-bold text-slate-400 uppercase tracking-wider">Score</div>
                <div id="score" class="text-lg font-extrabold text-pink-400">0</div>
            </div>
            <div class="glass-panel px-3 py-1.5 rounded-xl text-center min-w-[70px]">
                <div class="text-[9px] font-bold text-slate-400 uppercase tracking-wider">Best</div>
                <div id="best-score" class="text-lg font-extrabold text-amber-400">0</div>
            </div>
        </div>
    </div>

    <!-- Controls Bar -->
    <div class="w-full max-w-md flex gap-2">
        <button id="btn-new" class="flex-1 glass-panel hover:bg-slate-800 text-slate-200 font-bold py-2 px-3 rounded-xl transition flex items-center justify-center gap-2 active:scale-95 text-xs">
            <svg class="w-3.5 h-3.5 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            New Game
        </button>
        <button id="btn-undo" class="flex-1 glass-panel hover:bg-slate-800 text-slate-200 font-bold py-2 px-3 rounded-xl transition flex items-center justify-center gap-2 active:scale-95 text-xs">
            <svg class="w-3.5 h-3.5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>
            Undo
        </button>
    </div>

    <!-- Board Container -->
    <div class="board-wrapper">
        <div id="grid" class="grid-container">
            <!-- 16 Slots -->
            <div class="tile-slot"></div><div class="tile-slot"></div><div class="tile-slot"></div><div class="tile-slot"></div>
            <div class="tile-slot"></div><div class="tile-slot"></div><div class="tile-slot"></div><div class="tile-slot"></div>
            <div class="tile-slot"></div><div class="tile-slot"></div><div class="tile-slot"></div><div class="tile-slot"></div>
            <div class="tile-slot"></div><div class="tile-slot"></div><div class="tile-slot"></div><div class="tile-slot"></div>
        </div>

        <!-- Overlays -->
        <div id="overlay" class="absolute inset-0 bg-slate-950/85 backdrop-blur-md rounded-2xl flex flex-col items-center justify-center hidden z-30 transition-all">
            <h2 id="overlay-title" class="text-3xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-r from-pink-500 to-cyan-400">Game Over!</h2>
            <p id="overlay-desc" class="text-slate-400 text-xs font-medium mb-4">No more possible moves available.</p>
            <button id="btn-restart" class="bg-gradient-to-r from-pink-500 to-purple-600 text-white text-xs font-bold py-2.5 px-6 rounded-xl shadow-lg shadow-pink-500/25 active:scale-95 transition">
                Try Again
            </button>
        </div>
    </div>

    <!-- Footer Guide -->
    <div class="w-full max-w-md text-center text-[11px] text-slate-500 font-medium">
        Swipe or use <span class="bg-slate-800 text-slate-300 px-1.5 py-0.5 rounded border border-slate-700">Arrow Keys</span> to play
    </div>

    <script>
        const SIZE = 4;
        let board = [];
        let tiles = [];
        let score = 0;
        let bestScore = parseInt(localStorage.getItem('cyber2048_best') || '0');
        let previousState = null;
        let tileIdCounter = 1;
        let isMoving = false;

        const gridEl = document.getElementById('grid');
        const scoreEl = document.getElementById('score');
        const bestScoreEl = document.getElementById('best-score');
        const overlayEl = document.getElementById('overlay');

        function init() {
            bestScoreEl.innerText = bestScore;
            newGame();
        }

        function newGame() {
            document.querySelectorAll('.tile').forEach(t => t.remove());
            board = Array(SIZE).fill(null).map(() => Array(SIZE).fill(null));
            tiles = [];
            score = 0;
            previousState = null;
            updateScore(0);
            overlayEl.classList.add('hidden');
            addRandomTile();
            addRandomTile();
            render();
        }

        function updateScore(val) {
            score = val;
            scoreEl.innerText = score;
            if (score > bestScore) {
                bestScore = score;
                bestScoreEl.innerText = bestScore;
                localStorage.setItem('cyber2048_best', bestScore);
            }
        }

        function saveState() {
            previousState = {
                board: board.map(row => row.map(cell => cell ? { ...cell } : null)),
                score: score
            };
        }

        function undo() {
            if (!previousState || isMoving) return;
            document.querySelectorAll('.tile').forEach(t => t.remove());
            tiles = [];
            board = previousState.board.map(row => row.map(cell => {
                if (cell) {
                    const newTile = { ...cell, isNew: false, merged: false };
                    createTileDOM(newTile);
                    tiles.push(newTile);
                    return newTile;
                }
                return null;
            }));
            updateScore(previousState.score);
            previousState = null;
            overlayEl.classList.add('hidden');
            render();
        }

        function addRandomTile() {
            const emptyCells = [];
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (!board[r][c]) emptyCells.push({ r, c });
                }
            }
            if (emptyCells.length > 0) {
                const { r, c } = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                const val = Math.random() < 0.9 ? 2 : 4;
                const newTile = {
                    id: tileIdCounter++,
                    val: val,
                    r: r,
                    c: c,
                    isNew: true,
                    merged: false
                };
                board[r][c] = newTile;
                tiles.push(newTile);
                createTileDOM(newTile);
            }
        }

        function createTileDOM(tile) {
            const el = document.createElement('div');
            el.id = `tile-${tile.id}`;
            el.className = `tile tile-${tile.val}`;
            el.innerText = tile.val;
            gridEl.appendChild(el);
            tile.el = el;
        }

        function getTilePos(r, c) {
            const containerWidth = gridEl.clientWidth;
            const gap = 8;
            const padding = 8;
            const tileSize = (containerWidth - (padding * 2) - (gap * (SIZE - 1))) / SIZE;
            const left = padding + c * (tileSize + gap);
            const top = padding + r * (tileSize + gap);
            return { left, top, tileSize };
        }

        function render() {
            tiles.forEach(tile => {
                const { left, top, tileSize } = getTilePos(tile.r, tile.c);
                const el = tile.el;
                
                el.style.width = `${tileSize}px`;
                el.style.height = `${tileSize}px`;
                
                const posStr = `translate(${left}px, ${top}px)`;
                el.style.setProperty('--tile-pos', posStr);
                el.style.transform = posStr;

                el.className = `tile tile-${tile.val}`;

                if (tile.isNew) {
                    el.classList.add('tile-new');
                    tile.isNew = false;
                } else if (tile.merged) {
                    el.classList.add('tile-merged');
                    tile.merged = false;
                }
            });
        }

        async function move(dir) {
            if (isMoving) return;
            isMoving = true;

            let moved = false;
            let earnedScore = 0;
            const tilesToRemove = [];
            const tempBoardState = board.map(row => row.map(cell => cell ? { ...cell } : null));

            function processLine(line) {
                let result = [];
                for (let i = 0; i < line.length; i++) {
                    if (!line[i]) continue;
                    let next = i + 1;
                    while (next < line.length && !line[next]) next++;

                    if (next < line.length && line[i].val === line[next].val) {
                        const targetVal = line[i].val * 2;
                        earnedScore += targetVal;
                        const mergedTile = {
                            id: tileIdCounter++,
                            val: targetVal,
                            r: 0, c: 0,
                            isNew: false,
                            merged: true
                        };
                        
                        line[i].toRemove = true;
                        line[next].toRemove = true;
                        tilesToRemove.push(line[i], line[next]);

                        result.push({ tile: mergedTile, from: [line[i], line[next]] });
                        i = next;
                    } else {
                        result.push({ tile: line[i] });
                    }
                }
                return result;
            }

            if (dir === 'left') {
                for (let r = 0; r < SIZE; r++) {
                    const line = board[r];
                    const processed = processLine(line);
                    for (let c = 0; c < SIZE; c++) {
                        const item = processed[c];
                        if (item) {
                            if (item.from) {
                                item.from.forEach(t => { t.r = r; t.c = c; });
                                item.tile.r = r; item.tile.c = c;
                                board[r][c] = item.tile;
                                tiles.push(item.tile);
                                createTileDOM(item.tile);
                                moved = true;
                            } else {
                                if (item.tile.r !== r || item.tile.c !== c) moved = true;
                                item.tile.r = r; item.tile.c = c;
                                board[r][c] = item.tile;
                            }
                        } else {
                            if (board[r][c]) moved = true;
                            board[r][c] = null;
                        }
                    }
                }
            } else if (dir === 'right') {
                for (let r = 0; r < SIZE; r++) {
                    const line = [...board[r]].reverse();
                    const processed = processLine(line);
                    for (let c = 0; c < SIZE; c++) {
                        const targetC = SIZE - 1 - c;
                        const item = processed[c];
                        if (item) {
                            if (item.from) {
                                item.from.forEach(t => { t.r = r; t.c = targetC; });
                                item.tile.r = r; item.tile.c = targetC;
                                board[r][targetC] = item.tile;
                                tiles.push(item.tile);
                                createTileDOM(item.tile);
                                moved = true;
                            } else {
                                if (item.tile.r !== r || item.tile.c !== targetC) moved = true;
                                item.tile.r = r; item.tile.c = targetC;
                                board[r][targetC] = item.tile;
                            }
                        } else {
                            if (board[r][targetC]) moved = true;
                            board[r][targetC] = null;
                        }
                    }
                }
            } else if (dir === 'up') {
                for (let c = 0; c < SIZE; c++) {
                    const line = [board[0][c], board[1][c], board[2][c], board[3][c]];
                    const processed = processLine(line);
                    for (let r = 0; r < SIZE; r++) {
                        const item = processed[r];
                        if (item) {
                            if (item.from) {
                                item.from.forEach(t => { t.r = r; t.c = c; });
                                item.tile.r = r; item.tile.c = c;
                                board[r][c] = item.tile;
                                tiles.push(item.tile);
                                createTileDOM(item.tile);
                                moved = true;
                            } else {
                                if (item.tile.r !== r || item.tile.c !== c) moved = true;
                                item.tile.r = r; item.tile.c = c;
                                board[r][c] = item.tile;
                            }
                        } else {
                            if (board[r][c]) moved = true;
                            board[r][c] = null;
                        }
                    }
                }
            } else if (dir === 'down') {
                for (let c = 0; c < SIZE; c++) {
                    const line = [board[3][c], board[2][c], board[1][c], board[0][c]];
                    const processed = processLine(line);
                    for (let r = 0; r < SIZE; r++) {
                        const targetR = SIZE - 1 - r;
                        const item = processed[r];
                        if (item) {
                            if (item.from) {
                                item.from.forEach(t => { t.r = targetR; t.c = c; });
                                item.tile.r = targetR; item.tile.c = c;
                                board[targetR][c] = item.tile;
                                tiles.push(item.tile);
                                createTileDOM(item.tile);
                                moved = true;
                            } else {
                                if (item.tile.r !== targetR || item.tile.c !== c) moved = true;
                                item.tile.r = targetR; item.tile.c = c;
                                board[targetR][c] = item.tile;
                            }
                        } else {
                            if (board[targetR][c]) moved = true;
                            board[targetR][c] = null;
                        }
                    }
                }
            }

            if (moved) {
                previousState = { board: tempBoardState, score: score };
                render();

                await new Promise(res => setTimeout(res, 150));

                tilesToRemove.forEach(t => {
                    if (t.el) t.el.remove();
                    tiles = tiles.filter(x => x.id !== t.id);
                });

                updateScore(score + earnedScore);
                addRandomTile();
                render();
                checkGameOver();
            }

            isMoving = false;
        }

        function checkGameOver() {
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (!board[r][c]) return;
                }
            }
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (c < SIZE - 1 && board[r][c].val === board[r][c + 1].val) return;
                    if (r < SIZE - 1 && board[r][c].val === board[r + 1][c].val) return;
                }
            }
            overlayEl.classList.remove('hidden');
        }

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
                e.preventDefault();
            }
            if (e.key === 'ArrowLeft') move('left');
            if (e.key === 'ArrowRight') move('right');
            if (e.key === 'ArrowUp') move('up');
            if (e.key === 'ArrowDown') move('down');
        });

        // Touch Controls (with anti-scroll prevention)
        let startX = 0, startY = 0;
        gridEl.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        }, { passive: true });

        gridEl.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });

        gridEl.addEventListener('touchend', (e) => {
            if (!startX || !startY) return;
            let diffX = e.changedTouches[0].clientX - startX;
            let diffY = e.changedTouches[0].clientY - startY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (Math.abs(diffX) > 30) {
                    if (diffX > 0) move('right');
                    else move('left');
                }
            } else {
                if (Math.abs(diffY) > 30) {
                    if (diffY > 0) move('down');
                    else move('up');
                }
            }
            startX = 0;
            startY = 0;
        }, { passive: true });

        document.getElementById('btn-new').addEventListener('click', newGame);
        document.getElementById('btn-restart').addEventListener('click', newGame);
        document.getElementById('btn-undo').addEventListener('click', undo);

        window.addEventListener('resize', render);
        init();
    </script>
</body>
</html>
