        .tile-new { animation: appear 0.18s ease-out forwards; }

        @keyframes appear {
            0% { opacity: 0; transform: var(--tile-pos) scale(0); }

        @keyframes pop {

    <script>
        // ==========================================
        // 🛠️ FIREBASE CONFIGURATION
        // ==========================================
        const firebaseConfig = {
          apiKey: "AIzaSyAAAwcNQ5mDUUR_A27PbGNhu64tytQ7tSE",
          authDomain: "mini-game-2048.firebaseapp.com",
          projectId: "mini-game-2048",
          storageBucket: "mini-game-2048.firebasestorage.app",
          messagingSenderId: "119779986825",
          appId: "1:119779986825:web:e1bbc859f068ff882da558",
          measurementId: "G-F8B9HWR005"
        };

        let db = null;
        try {
            if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY") {
                firebase.initializeApp(firebaseConfig);
                db = firebase.firestore();
            }
        } catch (e) {
            console.log("Firebase initialization failed");
        }

        // ==========================================
        // 🎮 GAME CORE LOGIC
        // ==========================================
        const SIZE = 4;
        let board = [];
        let tiles = [];
        let score = 0;
        let bestScore = parseInt(localStorage.getItem('cyber2048_best') || '0');
        let previousState = null;
        let tileIdCounter = 1;
        let isMoving = false;

        const gridEl = document.getElementById('grid');
        const scoreEl = document.getElementById('score');
        const bestScoreEl = document.getElementById('best-score');
        const overlayEl = document.getElementById('overlay');

        function init() {
            bestScoreEl.innerText = bestScore;
            newGame();
        }

        function newGame() {
            document.querySelectorAll('.tile').forEach(t => t.remove());
            board = Array(SIZE).fill(null).map(() => Array(SIZE).fill(null));
            tiles = [];
            score = 0;
            previousState = null;
            updateScore(0);
            overlayEl.classList.add('hidden');
            document.getElementById('submit-score-box').classList.remove('hidden');
            addRandomTile();
            addRandomTile();
            render();
        }

        function updateScore(val) {
            score = val;
            scoreEl.innerText = score;
            if (score > bestScore) {
                bestScore = score;
                bestScoreEl.innerText = bestScore;
                localStorage.setItem('cyber2048_best', bestScore);
            }
        }

        function saveHistoryRecord(finalScore, maxTile) {
            let history = JSON.parse(localStorage.getItem('cyber2048_history') || '[]');
            const record = {
                score: finalScore,
                maxTile: maxTile,
                date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };
            history.unshift(record);
            if (history.length > 20) history = history.slice(0, 20);
            localStorage.setItem('cyber2048_history', JSON.stringify(history));
        }

        function getMaxTileVal() {
            let max = 0;
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (board[r][c] && board[r][c].val > max) max = board[r][c].val;
                }
            }
            return max;
        }

        function undo() {
            if (!previousState || isMoving) return;
            document.querySelectorAll('.tile').forEach(t => t.remove());
            tiles = [];
            board = previousState.board.map(row => row.map(cell => {
                if (cell) {
                    const newTile = { ...cell, isNew: false, merged: false };
                    createTileDOM(newTile);
                    tiles.push(newTile);
                    return newTile;
                }
                return null;
            }));
            updateScore(previousState.score);
            previousState = null;
            overlayEl.classList.add('hidden');
            render();
        }

        function addRandomTile() {
            const emptyCells = [];
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (!board[r][c]) emptyCells.push({ r, c });
                }
            }
            if (emptyCells.length > 0) {
                const { r, c } = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                const val = Math.random() < 0.9 ? 2 : 4;
                const newTile = { id: tileIdCounter++, val: val, r: r, c: c, isNew: true, merged: false };
                board[r][c] = newTile;
                tiles.push(newTile);
                createTileDOM(newTile);
            }
        }

        function createTileDOM(tile) {
            const el = document.createElement('div');
            el.id = `tile-${tile.id}`;
            el.className = `tile tile-${tile.val}`;
            el.innerText = tile.val;
            gridEl.appendChild(el);
            tile.el = el;
        }

        function getTilePos(r, c) {
            const containerWidth = gridEl.clientWidth;
            const gap = 8;
            const padding = 8;
            const tileSize = (containerWidth - (padding * 2) - (gap * (SIZE - 1))) / SIZE;
            const left = padding + c * (tileSize + gap);
            const top = padding + r * (tileSize + gap);
            return { left, top, tileSize };
        }

        function render() {
            tiles.forEach(tile => {
                const { left, top, tileSize } = getTilePos(tile.r, tile.c);
                const el = tile.el;
                el.style.width = `${tileSize}px`;
                el.style.height = `${tileSize}px`;
                const posStr = `translate(${left}px, ${top}px)`;
                el.style.setProperty('--tile-pos', posStr);
                el.style.transform = posStr;
                el.className = `tile tile-${tile.val}`;
                if (tile.isNew) {
                    el.classList.add('tile-new');
                    tile.isNew = false;
                } else if (tile.merged) {
                    el.classList.add('tile-merged');
                    tile.merged = false;
                }
            });
        }

        async function move(dir) {
            if (isMoving) return;
            isMoving = true;
            let moved = false;
            let earnedScore = 0;
            const tilesToRemove = [];
            const tempBoardState = board.map(row => row.map(cell => cell ? { ...cell } : null));

            function processLine(line) {
                let result = [];
                for (let i = 0; i < line.length; i++) {
                    if (!line[i]) continue;
                    let next = i + 1;
                    while (next < line.length && !line[next]) next++;
                    if (next < line.length && line[i].val === line[next].val) {
                        const targetVal = line[i].val * 2;
                        earnedScore += targetVal;
                        const mergedTile = { id: tileIdCounter++, val: targetVal, r: 0, c: 0, isNew: false, merged: true };
                        line[i].toRemove = true;
                        line[next].toRemove = true;
                        tilesToRemove.push(line[i], line[next]);
                        result.push({ tile: mergedTile, from: [line[i], line[next]] });
                        i = next;
                    } else {
                        result.push({ tile: line[i] });
                    }
                }
                return result;
            }

            if (dir === 'left') {
                for (let r = 0; r < SIZE; r++) {
                    const processed = processLine(board[r]);
                    for (let c = 0; c < SIZE; c++) {
                        const item = processed[c];
                        if (item) {
                            if (item.from) {
                                item.from.forEach(t => { t.r = r; t.c = c; });
                                item.tile.r = r; item.tile.c = c;
                                board[r][c] = item.tile; tiles.push(item.tile); createTileDOM(item.tile); moved = true;
                            } else {
                                if (item.tile.r !== r || item.tile.c !== c) moved = true;
                                item.tile.r = r; item.tile.c = c; board[r][c] = item.tile;
                            }
                        } else {
                            if (board[r][c]) moved = true;
                            board[r][c] = null;
                        }
                    }
                }
            } else if (dir === 'right') {
                for (let r = 0; r < SIZE; r++) {
                    const processed = processLine([...board[r]].reverse());
                    for (let c = 0; c < SIZE; c++) {
                        const targetC = SIZE - 1 - c;
                        const item = processed[c];
                        if (item) {
                            if (item.from) {
                                item.from.forEach(t => { t.r = r; t.c = targetC; });
                                item.tile.r = r; item.tile.c = targetC;
                                board[r][targetC] = item.tile; tiles.push(item.tile); createTileDOM(item.tile); moved = true;
                            } else {
                                if (item.tile.r !== r || item.tile.c !== targetC) moved = true;
                                item.tile.r = r; item.tile.c = targetC; board[r][targetC] = item.tile;
                            }
                        } else {
                            if (board[r][targetC]) moved = true;
                            board[r][targetC] = null;
                        }
                    }
                }
            } else if (dir === 'up') {
                for (let c = 0; c < SIZE; c++) {
                    const processed = processLine([board[0][c], board[1][c], board[2][c], board[3][c]]);
                    for (let r = 0; r < SIZE; r++) {
                        const item = processed[r];
                        if (item) {
                            if (item.from) {
                                item.from.forEach(t => { t.r = r; t.c = c; });
                                item.tile.r = r; item.tile.c = c;
                                board[r][c] = item.tile; tiles.push(item.tile); createTileDOM(item.tile); moved = true;
                            } else {
                                if (item.tile.r !== r || item.tile.c !== c) moved = true;
                                item.tile.r = r; item.tile.c = c; board[r][c] = item.tile;
                            }
                        } else {
                            if (board[r][c]) moved = true;
                            board[r][c] = null;
                        }
                    }
                }
            } else if (dir === 'down') {
                for (let c = 0; c < SIZE; c++) {
                    const processed = processLine([board[3][c], board[2][c], board[1][c], board[0][c]]);
                    for (let r = 0; r < SIZE; r++) {
                        const targetR = SIZE - 1 - r;
                        const item = processed[r];
                        if (item) {
                            if (item.from) {
                                item.from.forEach(t => { t.r = targetR; t.c = c; });
                                item.tile.r = targetR; item.tile.c = c;
                                board[targetR][c] = item.tile; tiles.push(item.tile); createTileDOM(item.tile); moved = true;
                            } else {
                                if (item.tile.r !== targetR || item.tile.c !== c) moved = true;
                                item.tile.r = targetR; item.tile.c = c; board[targetR][c] = item.tile;
                            }
                        } else {
                            if (board[targetR][c]) moved = true;
                            board[targetR][c] = null;
                        }
                    }
                }
            }

            if (moved) {
                previousState = { board: tempBoardState, score: score };
                render();
                await new Promise(res => setTimeout(res, 150));
                tilesToRemove.forEach(t => {
                    if (t.el) t.el.remove();
                    tiles = tiles.filter(x => x.id !== t.id);
                });
                updateScore(score + earnedScore);
                addRandomTile();
                render();
                checkGameOver();
            }
            isMoving = false;
        }

        function checkGameOver() {
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (!board[r][c]) return;
                }
            }
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (c < SIZE - 1 && board[r][c].val === board[r][c + 1].val) return;
                    if (r < SIZE - 1 && board[r][c].val === board[r + 1][c].val) return;
                }
            }
            saveHistoryRecord(score, getMaxTileVal());
            document.getElementById('current-end-score').innerText = score;
            overlayEl.classList.remove('hidden');
        }

        // ==========================================
        // 📊 UI Modals & Data Handling
        // ==========================================
        const modalHistory = document.getElementById('modal-history');
        const modalRank = document.getElementById('modal-rank');
        const historyListEl = document.getElementById('history-list');
        const rankListEl = document.getElementById('rank-list');

        document.getElementById('btn-history').addEventListener('click', () => {
            const history = JSON.parse(localStorage.getItem('cyber2048_history') || '[]');
            if (history.length === 0) {
                historyListEl.innerHTML = `<div class="text-center text-slate-500 py-6">No game history yet, play a game now!</div>`;
            } else {
                historyListEl.innerHTML = history.map(item => `
                    <div class="bg-slate-900/80 border border-slate-800 p-2 rounded-xl flex justify-between items-center">
                        <div>
                            <div class="text-slate-400 text-[10px]">${item.date}</div>
                            <div class="text-white font-bold">Max Tile: <span class="text-cyan-400">${item.maxTile}</span></div>
                        </div>
                        <div class="text-right">
                            <div class="text-[10px] text-slate-400">Score</div>
                            <div class="text-pink-400 font-extrabold text-sm">${item.score}</div>
                        </div>
                    </div>
                `).join('');
            }
            modalHistory.classList.remove('hidden');
        });

        document.getElementById('close-history').addEventListener('click', () => modalHistory.classList.add('hidden'));

        document.getElementById('btn-rank').addEventListener('click', async () => {
            modalRank.classList.remove('hidden');
            if (!db) {
                rankListEl.innerHTML = `<div class="text-center text-amber-400 py-4 px-2 text-xs">Please ensure valid Firebase configuration.</div>`;
                return;
            }
            try {
                rankListEl.innerHTML = `<div class="text-center text-slate-500 py-6">Loading...</div>`;
                const snapshot = await db.collection('leaderboard').orderBy('score', 'desc').limit(100).get();
                if (snapshot.empty) {
                    rankListEl.innerHTML = `<div class="text-center text-slate-500 py-6">No global records found!</div>`;
                    return;
                }
                let html = '';
                let rank = 1;
                snapshot.forEach(doc => {
                    const data = doc.data();
                    let badgeColor = "text-slate-300";
                    if (rank === 1) badgeColor = "text-amber-400 font-black text-sm";
                    else if (rank === 2) badgeColor = "text-slate-200 font-bold";
                    else if (rank === 3) badgeColor = "text-amber-600 font-bold";

                    let displayDate = data.date || '';
                    if (data.date && typeof data.date === 'object' && data.date.seconds) {
                        displayDate = new Date(data.date.seconds * 1000).toLocaleDateString();
                    }

                    html += `
                        <div class="bg-slate-900/80 border border-slate-800 p-2 rounded-xl flex justify-between items-center">
                            <div class="flex items-center gap-3">
                                <span class="${badgeColor} w-6 text-center">#${rank}</span>
                                <div>
                                    <div class="text-white font-bold text-xs">${escapeHtml(data.name || 'Anonymous')}</div>
                                    <div class="text-[9px] text-slate-500">${displayDate}</div>
                                </div>
                            </div>
                            <div class="text-pink-400 font-extrabold text-sm">${data.score}</div>
                        </div>
                    `;
                    rank++;
                });
                rankListEl.innerHTML = html;
            } catch (err) {
                rankListEl.innerHTML = `<div class="text-center text-red-400 py-6">Failed to load leaderboard.</div>`;
            }
        });

        document.getElementById('close-rank').addEventListener('click', () => modalRank.classList.add('hidden'));

        document.getElementById('btn-submit-score').addEventListener('click', async () => {
            const nameInput = document.getElementById('player-name').value.trim() || 'Anonymous';
            if (!db) {
                alert("Firebase is not configured!");
                return;
            }
            const btn = document.getElementById('btn-submit-score');
            btn.innerText = "Submitting...";
            btn.disabled = true;

            try {
                await db.collection('leaderboard').add({
                    name: nameInput,
                    score: score,
                    maxTile: getMaxTileVal(),
                    date: new Date().toLocaleDateString()
                });
                alert("Score successfully submitted!");
                document.getElementById('submit-score-box').classList.add('hidden');
            } catch (e) {
                alert("Submission failed, please try again.");
                btn.innerText = "Submit to Leaderboard";
                btn.disabled = false;
            }
        });

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // ==========================================
        // 🕹️ Full-Screen Touch & Keyboard Controls
        // ==========================================
        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
            if (e.key === 'ArrowLeft') move('left');
            if (e.key === 'ArrowRight') move('right');
            if (e.key === 'ArrowUp') move('up');
            if (e.key === 'ArrowDown') move('down');
        });

        let startX = 0, startY = 0;

        document.addEventListener('touchstart', (e) => {
            if (e.target.closest('button, input, #modal-history, #modal-rank')) return;
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        }, { passive: true });

        document.addEventListener('touchmove', (e) => {
            if (e.target.closest('button, input, #modal-history, #modal-rank')) return;
            e.preventDefault();
        }, { passive: false });

        document.addEventListener('touchend', (e) => {
            if (!startX || !startY) return;
            if (e.target.closest('button, input, #modal-history, #modal-rank')) return;

            let diffX = e.changedTouches[0].clientX - startX;
            let diffY = e.changedTouches[0].clientY - startY;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (Math.abs(diffX) > 30) { if (diffX > 0) move('right'); else move('left'); }
            } else {
                if (Math.abs(diffY) > 30) { if (diffY > 0) move('down'); else move('up'); }
            }
            startX = 0; startY = 0;
        }, { passive: true });

        document.getElementById('btn-new').addEventListener('click', newGame);
        document.getElementById('btn-restart').addEventListener('click', newGame);
        document.getElementById('btn-undo').addEventListener('click', undo);
        window.addEventListener('resize', render);

        init();

      
// ==========================================
        // 🌐 Dynamic Navbar Loader Handler
        // ==========================================
<script>
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById('navbar-container');
            if (!container) return;

            fetch('navbar.html')
                .then(response => {
                    if (!response.ok) throw new Error('Failed to load navbar');
                    return response.text();
                })
                .then(html => {
                    container.innerHTML = html;

                    // 綁定手機版漢堡包點擊事件（修正版）
                    const navToggle = document.getElementById('navToggle');
                    const navMenu = document.getElementById('navMenu');
                    if (navToggle && navMenu) {
                        navToggle.addEventListener('click', () => {
                            // 點擊時切換 hidden 狀態，並在手機上展開為 flex
                            navMenu.classList.toggle('hidden');
                            navMenu.classList.toggle('flex');
                        });
                    }

                    // 自動根據當前網頁檔名高亮對應的 Link
                    const currentPage = window.location.pathname.split('/').pop() || 'index.html';
                    const navLinks = document.querySelectorAll('.nav-link');
                    navLinks.forEach(link => {
                        const linkPage = link.getAttribute('href');
                        if (linkPage === currentPage) {
                            link.classList.add('active');
                        }
                    });
                })
                .catch(error => console.log('Navbar component not loaded yet.'));
        });
</script>

</body>
</html>
